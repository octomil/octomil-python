name: OpenAPI types freshness

# Python equivalent of octomil-node PR #95 (openapi-types-fresh.yml).
# Regenerates Pydantic v2 models from the contracts OpenAPI spec and
# fails if the committed octomil/_generated/types.py is out of date.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: openapi-types-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freshness:
    name: Generated types are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout octomil-python
        uses: actions/checkout@v4
        with:
          path: octomil-python

      - name: Checkout octomil-contracts
        uses: actions/checkout@v4
        with:
          repository: octomil/octomil-contracts
          path: octomil-contracts
          # Cross-repo checkout of a private repo — github.token cannot
          # read it. CROSS_REPO_READ_TOKEN must be a PAT with
          # `contents: read` on octomil/octomil-contracts. Mirrors
          # #612 so this branch is correct regardless of merge order.
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install datamodel-code-generator and ruff
        run: pip install "datamodel-code-generator==0.27.0" "ruff>=0.4.0"

      - name: Install contracts spec-build deps
        run: pip install pyyaml

      - name: Regenerate types
        run: |
          OCTOMIL_PYTHON_PATH="${{ github.workspace }}/octomil-python" \
          OCTOMIL_PYTHON=1 \
          OCTOMIL_SKIP_INSTALL=1 \
          octomil-contracts/tools/sdkgen/generate-python.sh
        working-directory: ${{ github.workspace }}

      - name: Format generated file (ruff)
        run: ruff format octomil/_generated/types.py
        working-directory: octomil-python

      - name: Check banner
        run: python3 scripts/check_openapi_banner.py
        working-directory: octomil-python

      - name: Fail if types.py is stale
        run: |
          git diff --exit-code octomil/_generated/types.py || {
            echo "ERROR: octomil/_generated/types.py is out of date."
            echo "Run 'make openapi-generate' in octomil-python and commit the result."
            exit 1
          }
        working-directory: octomil-python

      - name: Fetch latest server openapi snapshot
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          SERVER_RUN=$(gh run list --repo octomil/octomil-server --workflow ci.yml \
                --branch main --status success --limit 1 --json databaseId,headSha \
                -q '.[0] | "\(.databaseId) \(.headSha)"')
          read -r RUN_ID SHA <<< "$SERVER_RUN"
          if [ -z "${RUN_ID:-}" ] || [ -z "${SHA:-}" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::Could not resolve a successful octomil-server ci.yml run. Check CROSS_REPO_READ_TOKEN actions:read access."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.snapshot"
          if ! gh run download "$RUN_ID" --repo octomil/octomil-server --name "openapi-snapshot-${SHA}" --dir "$GITHUB_WORKSPACE/.snapshot"; then
            echo "::error::Could not download openapi-snapshot-${SHA} from octomil-server run ${RUN_ID}. Check artifact publication and CROSS_REPO_READ_TOKEN actions:read access."
            exit 1
          fi
          test -f "$GITHUB_WORKSPACE/.snapshot/openapi-snapshot.json"
          echo "Fetched snapshot for SHA $SHA from server run $RUN_ID"
          ls -la "$GITHUB_WORKSPACE/.snapshot/"

      - name: Strict spec->server gate (this SDK's contracts SHA has a real server route)
        run: |
          # Verify every contract method this SDK was generated against
          # has a real server route. Without this, the SDK could ship
          # clients for spec-only endpoints that 404 at runtime.
          cd "$GITHUB_WORKSPACE/octomil-contracts"
          python3 scripts/spec_coverage.py --strict --openapi-file "$GITHUB_WORKSPACE/.snapshot/openapi-snapshot.json" || {
            echo "::error::SDK was generated against a contracts SHA with documented-but-not-in-server methods."
            echo "Wait for octomil-server to ship matching endpoints, OR mark stray methods transport: local in contracts."
            exit 1
          }
