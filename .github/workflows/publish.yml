name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    timeout-minutes: 15
    name: Publish Package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # Needs a PyPI trusted publisher bound to this workflow and the `pypi` environment (add required reviewers there).
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Apply release version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python scripts/set-release-version.py "${TAG}"

      - name: Build package
        run: python -m build

      - name: Verify wheel facade export
        run: scripts/check-wheel-facade-export.sh

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
