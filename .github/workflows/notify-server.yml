name: Notify Server

on:
  push:
    tags:
      - 'v*'

jobs:
  notify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.VERSION_BOT_APP_ID }}
          private-key: ${{ secrets.VERSION_BOT_PRIVATE_KEY }}
          owner: octomil
          repositories: octomil-server

      - name: Get version
        id: version
        run: |
          version=$(python -c 'import octomil; print(octomil.__version__)')
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Dispatch to server
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: octomil/octomil-server
          event-type: sdk-release
          client-payload: '{"sdk": "python", "version": "${{ steps.version.outputs.version }}"}'
