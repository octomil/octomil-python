name: Architecture Boundaries

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  boundaries:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Generate contracts read token
        id: contracts-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.VERSION_BOT_APP_ID }}
          private-key: ${{ secrets.VERSION_BOT_PRIVATE_KEY }}
          owner: octomil
          repositories: octomil-contracts
          permission-contents: read

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: octomil/octomil-contracts
          ref: v1.22.0
          path: .contract
          persist-credentials: false
          token: ${{ steps.contracts-token.outputs.token }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Check architecture boundaries
        run: python .contract/ci/check_boundaries.py --repo .
